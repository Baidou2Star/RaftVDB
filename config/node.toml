[cluster]
# 默认模板改为“本机可直接启动”的单节点模式。
# 当前实现里，多节点模式要求 cluster.node_id 直接使用本机可绑定的 gRPC 地址。
# 如果要部署多节点，请把 node_id 改成当前机器真实存在的 host:port，
# 再把其余节点地址填入 peers 列表。
node_id = "127.0.0.1:7001"
peers = []

[raft]
heartbeat_interval_ms = 150
election_timeout_min_ms = 300
election_timeout_max_ms = 600
clock_drift_bound_ms = 50
snapshot_threshold = 10000
pipeline_window_size = 16
batch_max_entries = 64
batch_flush_interval_us = 500
mentor_ack_timeout_ms = 200
mentor_recover_timeout_ms = 3000
topology_refresh_interval_ms = 30000

[vector]
dim = 1024
metric = "ip"
data_type = "f32"
initial_capacity = 100000
connectivity = 16
expansion_add = 128
expansion_search = 64

[index_maintenance]
check_interval_s = 60
compact_delete_ratio_threshold = 0.2
compact_max_interval_s = 604800
isolate_fragmentation_threshold = 0.1

[client]
dedup_window_size = 1000
retry_base_ms = 50
retry_max_ms = 2000
max_retry_count = 10

[server]
grpc_port = 7001

[logging]
level = "info"

[storage]
raft_log_dir = "./data/raft"
snapshot_dir = "./data/snapshot"
wal_segment_size_mb = 64
