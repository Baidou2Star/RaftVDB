syntax = "proto3";

package raftvdb.proto;

// 生成 C++ 代码时开启 arena，降低高频 RPC 场景下的消息分配开销。
option cc_enable_arenas = true;

// ─────────────────────────────────────────────────────────────
// 状态机命令与持久化基础消息
// ─────────────────────────────────────────────────────────────

// 向量写入命令。
// 由客户端请求最终转换成 LogEntry.payload 持久化到 WAL 中。
message UpsertCmd {
  // 被写入或覆盖的向量主键。
  uint64 id = 1;

  // 向量原始数据，维度由配置文件中的 vector.dim 决定。
  repeated float vector = 2;

  // 客户端去重请求 ID，用于后续幂等处理。
  string request_id = 3;
}

// 向量删除命令。
message DeleteCmd {
  // 被删除的向量主键。
  uint64 id = 1;

  // 客户端去重请求 ID，用于后续幂等处理。
  string request_id = 2;
}

// Raft 日志项。
// 这里保留为较薄的一层封装，payload 内部再嵌套具体命令。
message LogEntry {
  // 日志索引，从 1 开始单调递增。
  uint64 index = 1;

  // 产生该日志项的任期号。
  uint64 term = 2;

  // 日志项类型，对应本地 EntryType 枚举。
  uint32 type = 3;

  // 命令类型，对应本地 CmdType 枚举。
  uint32 cmd_type = 4;

  // 已序列化的 UpsertCmd / DeleteCmd / 未来扩展命令。
  bytes payload = 5;
}

// 持久化保存 currentTerm 和 votedFor 的元数据记录。
message RaftMetaRecord {
  uint64 current_term = 1;
  string voted_for = 2;
}

// DedupTable 中的单条已提交记录。
// pending 状态不会跟随快照持久化，因此这里不保存 committed 字段。
message DedupRecord {
  // 客户端请求唯一 ID。
  string request_id = 1;

  // 该请求最终对应的日志索引，用于滑动窗口按最旧记录淘汰。
  uint64 log_index = 2;

  // Apply 完成后的执行结果。
  bool success = 3;

  // 执行失败时的错误信息；成功时通常为空字符串。
  string error = 4;
}

// DedupTable 快照。随 snapshot.usearch 一起持久化为 dedup.bin。
message DedupSnapshot {
  repeated DedupRecord records = 1;
}

// 空消息，主要用于 GetLeader 等无需请求体的 RPC。
message Empty {}

// ─────────────────────────────────────────────────────────────
// 拓扑与链式复制辅助消息
// ─────────────────────────────────────────────────────────────

// 通过心跳和日志复制传播的拓扑信息。
message TopologyInfo {
  // 当前节点在拓扑中的角色："leader" | "mentor" | "follower"。
  string role = 1;

  // 若当前节点是 follower，则表示其上游 mentor/leader 节点 ID。
  string source_node_id = 2;

  // 仅对 mentor 有意义：
  // Leader 在广播给 Mentor 时，会把该 Mentor 当前负责的下游 Follower 节点 ID
  // 一并带上，便于 Mentor 在本地执行 T-23 的转发逻辑。
  // Leader / Follower 收到时该字段通常为空。
  string follower_node_id = 3;
}

// 客户端探测当前 Leader 时返回的简要信息。
message LeaderInfo {
  // 当前 Leader 节点 ID。
  string leader_id = 1;

  // 当前 Leader 对外可访问地址。
  string leader_addr = 2;

  // Leader 所处任期。
  uint64 term = 3;
}

// ─────────────────────────────────────────────────────────────
// AppendEntries
// ─────────────────────────────────────────────────────────────

// 日志复制请求，同时承载批量日志和拓扑同步信息。
message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;

  // 批量日志项，用于 Batch + Pipeline 发送。
  repeated LogEntry entries = 5;

  uint64 leader_commit = 6;

  // Leader 当前视角下的拓扑信息，用于跟随节点更新本地链路来源。
  TopologyInfo topology = 7;
}

// 日志复制响应。
message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;

  // 复制成功时，接收方当前匹配到的最后日志索引。
  uint64 match_index = 3;

  // 复制失败时的冲突索引提示。
  uint64 conflict_index = 4;

  // 复制失败时的冲突任期提示。
  uint64 conflict_term = 5;

  // 返回响应的节点 ID，用于 Leader 区分 Mentor / Follower 的 ACK 来源。
  string node_id = 6;
}

// ─────────────────────────────────────────────────────────────
// RequestVote
// ─────────────────────────────────────────────────────────────

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

// ─────────────────────────────────────────────────────────────
// Heartbeat
// ─────────────────────────────────────────────────────────────

// 心跳请求，负责保活、提交索引推进和拓扑广播。
message HeartbeatRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 commit_index = 3;
  TopologyInfo topology = 4;
}

message HeartbeatResponse {
  uint64 term = 1;
  bool success = 2;
  string node_id = 3;
}

// ─────────────────────────────────────────────────────────────
// InstallSnapshot
// ─────────────────────────────────────────────────────────────

// 快照流式传输中的单个分片。
message SnapshotChunk {
  // 当前 chunk 的原始字节数据。
  bytes data = 1;

  // 当前 chunk 在整份快照文件中的字节偏移。
  uint64 offset = 2;

  // 标记是否为最后一个 chunk。
  bool is_last = 3;

  // 以下字段用于在接收端重建快照元数据。
  uint64 raft_term = 4;
  uint64 raft_index = 5;
  uint32 dim = 6;
  string metric = 7;
  string data_type = 8;

  // 当前 chunk 所属文件名。
  // 目前用于在同一条快照流中顺序传输：
  // 1. snapshot.usearch
  // 2. dedup.bin
  string file_name = 9;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool success = 2;
}

// ─────────────────────────────────────────────────────────────
// ClientWrite
// ─────────────────────────────────────────────────────────────

// 客户端写入请求。
// 当前阶段统一复用一条 RPC 承载 Upsert / Delete，两类请求通过 cmd_type 区分。
message ClientWriteRequest {
  // 1 = Upsert, 2 = Delete
  uint32 cmd_type = 1;

  // 向量主键。
  uint64 id = 2;

  // Upsert 时携带的 float32 原始字节串；Delete 时为空。
  bytes vector = 3;

  // 客户端生成的幂等 request_id。
  string request_id = 4;
}

message ClientWriteResponse {
  // true 表示本次写入已经完成到可返回客户端的阶段。
  bool success = 1;

  // 业务错误信息。若 success=false 且 redirect_to 为空、error 也为空，
  // 表示当前仍在选举中，客户端应按退避策略重试。
  string error = 2;

  // 非 Leader 时返回的建议跳转地址。
  string redirect_to = 3;
}

// ─────────────────────────────────────────────────────────────
// ClientSearch
// ─────────────────────────────────────────────────────────────

// 单条搜索命中结果。
message SearchHit {
  uint64 id = 1;
  float distance = 2;
}

// 客户端搜索请求。
// 向量同样使用 float32 原始字节串传输，避免额外的 repeated float 编码开销。
message ClientSearchRequest {
  bytes vector = 1;
  uint32 top_k = 2;
}

message ClientSearchResponse {
  bool success = 1;
  string error = 2;
  string redirect_to = 3;
  repeated SearchHit hits = 4;
}

// ─────────────────────────────────────────────────────────────
// RaftService 定义
// ─────────────────────────────────────────────────────────────

service RaftService {
  // 复制日志项；也用于空 entries 的追加确认。
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

  // 发起选举时请求投票。
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // 周期性心跳与拓扑广播。
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // 以客户端流方式发送快照文件。
  rpc InstallSnapshot(stream SnapshotChunk) returns (InstallSnapshotResponse);

  // 供客户端或工具探测当前 Leader。
  rpc GetLeader(Empty) returns (LeaderInfo);

  // 客户端写入口，由 Leader 接收后转换成内部 Propose。
  rpc ClientWrite(ClientWriteRequest) returns (ClientWriteResponse);

  // 客户端读入口，由 Leader 在本地执行租约读。
  rpc ClientSearch(ClientSearchRequest) returns (ClientSearchResponse);
}
