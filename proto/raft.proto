syntax = "proto3";

package raftvdb.proto;

// T-05 starts introducing the protobuf messages that are already needed by the
// in-process data model. The remaining Raft RPC surface will be expanded in T-12.
message UpsertCmd {
  uint64 id = 1;
  repeated float vector = 2;
  string request_id = 3;
}

message DeleteCmd {
  uint64 id = 1;
  string request_id = 2;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  uint32 type = 3;
  uint32 cmd_type = 4;
  bytes payload = 5;
}

message RaftMetaRecord {
  uint64 current_term = 1;
  string voted_for = 2;
}

message Empty {}

service BootstrapService {
  rpc Ping(Empty) returns (Empty);
}
